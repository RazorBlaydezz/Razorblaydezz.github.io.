    .weather-alert {

   .bottom-label {
  position: fixed;
  bottom: 190px;
  left: 30px;
  font-family: 'PT Serif', serif;

}   
    .bottom-bar {
  position: fixed;
  bottom: 30px;
  left: 30px;
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: row;
  gap: 12px;
}
.bottom-bar a {
  color: #fff;
  text-decoration: none;
  font-family: 'PT Serif', serif;
  font-size: 14px;
  padding: 8px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  backdrop-filter: blur(10px);
  transition: background 0.2s;
}
.bottom-bar a:hover {
  background: rgba(255,255,255,0.12);
}   
    .sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkle-fly 0.7s ease-out forwards;
  z-index: 9999;
}
@keyframes sparkle-fly {
  0% {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) scale(0);
    opacity: 0;
  }
}   
    .sidebar {
  position: fixed;
  right: 30px;
  top: 25%;
  transform: translateY(-50%);
  list-style: none;

.sidebar a {

.sidebar a:hover {

}

  <script>
document.addEventListener('click', function(e) {
  for (let i = 0; i < 8; i++) {
    const sparkle = document.createElement('div');
    sparkle.classList.add('sparkle');
    sparkle.style.left = e.clientX + 'px';
    sparkle.style.top = e.clientY + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 40;
    sparkle.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    sparkle.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 700);
  }
});
</script> 
  <script>
async function fetchAlert() {
  try {
    const res = await fetch('https://api.weather.gov/alerts/active');
    const data = await res.json();
    const el = document.getElementById('weather-alert');
    if (data.features.length > 0) {
      const a = data.features[0].properties;
      el.innerHTML = '<div class="event">' + a.event + '</div>' +
        '<div class="area">' + a.areaDesc + '</div>' +
        '<div class="area">' + a.senderName + '</div>';
    } else {
      el.innerHTML = '<div class="area">No active warnings</div>';
    }
  } catch (e) {
    document.getElementById('weather-alert').innerHTML =
      '<div class="area">Unable to load</div>';
  }
}
fetchAlert();
setInterval(fetchAlert, 300000); // refreshes every 5 minutes
</script>
