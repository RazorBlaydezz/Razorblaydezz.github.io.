<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif&display=swap" rel="stylesheet">   
  <meta charset="UTF-8">
  <title>My Home</title>
  <style>
    .sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  pointer-events: none;
  animation: sparkle-fly 0.7s ease-out forwards;
  z-index: 9999;
}
@keyframes sparkle-fly {
  0% {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) scale(0);
    opacity: 0;
  }
}   
    .sidebar {
  position: fixed;
  right: 30px;
  top: 25%;
  transform: translateY(-50%);
  list-style: none;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.sidebar a {
  color: #fff;
  text-decoration: none;
  font-family: 'PT Serif', serif;
  font-size: 14px;
  padding: 8px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  backdrop-filter: blur(10px);
  transition: background 0.2s;
}
.sidebar a:hover {
  background: rgba(255,255,255,0.12);
}   
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: url('download (6).jpg') no-repeat center center/cover;   
      color: #fff;
      font-family: sans-serif;
      cursor: url('starrrrr.cur') 0 0, auto; 
    }
    input[type="text"] {
  width: 400px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #102422;
  background: #1b3c3a;    
  color: #fff;
  font-size: 16px;
}   
    .shortcuts {
      display: flex;
      gap: 20px;
      margin-top: 40px;
    }
    .shortcut {
      width: 80px;
      height: 80px;
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <script>
document.addEventListener('click', function(e) {
  for (let i = 0; i < 8; i++) {
    const sparkle = document.createElement('div');
    sparkle.classList.add('sparkle');
    sparkle.style.left = e.clientX + 'px';
    sparkle.style.top = e.clientY + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 40;
    sparkle.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    sparkle.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 700);
  }
});
</script>
